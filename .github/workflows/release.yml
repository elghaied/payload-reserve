name: Release

on:
  push:
    tags: ['v*']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:int

  release:
    needs: [lint, build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Extract changelog for this version
        id: changelog
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # Strip leading 'v' to get the version number
          version="${TAG_NAME#v}"

          # Extract the section for this version from CHANGELOG.md
          # Handles both bracketed (## [1.2.0]) and unbracketed (## 1.2.0) formats
          body=$(awk -v ver="$version" '
            /^## / {
              if (found) exit
              if (index($0, "[" ver "]") || index($0, " " ver)) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md)

          # If no changelog section found, fall back to a simple message
          if [ -z "$body" ]; then
            body="Release ${TAG_NAME}"
          fi

          # Write to file for the release step (avoids escaping issues)
          echo "$body" > /tmp/release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-body.md

      # OIDC trusted publishing needs a modern npm (>=11.5.1); the runner's
      # bundled npm is older. npm@latest requires Node>=22, which the jobs now use.
      - run: npm install -g npm@latest

      # Pack and publish as two steps rather than `pnpm publish`, because pnpm
      # forwards its ENTIRE argv to npm verbatim. Captured from pnpm 9.15.9 with
      # a shim standing in for npm:
      #
      #   npm publish --ignore-scripts <tarball> --no-git-checks --provenance --access public
      #
      # `--no-git-checks` is a pnpm-only flag, and npm >=12 rejects unknown flags
      # outright (`EUNKNOWNCONFIG: Unknown cli flag: --git-checks`) where npm 11
      # merely ignored them. So adding the `npm@latest` step above is what broke
      # publishing — it failed this way for v2.4.0 and again on the first v3.0.0
      # tag. Splitting the steps drops the offending flag while keeping pnpm's own
      # mechanism: `pnpm pack` is what applies `publishConfig` (remapping every
      # `exports` entry from ./src/*.ts to ./dist/*.js — npm does NOT do this, so
      # a plain `npm publish` here would ship a package resolving to files that
      # aren't in the tarball). Packing also needs no git checks at all, so the
      # flag is not merely moved to a config file, it stops being needed.
      - name: Pack (applies publishConfig exports remapping)
        run: pnpm pack
      - name: Publish to npm
        run: npm publish payload-reserve-*.tgz --provenance --access public
